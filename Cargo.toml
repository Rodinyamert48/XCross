[package]
name = "xcross"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui = { version = "0.37", default-features = false }
global-hotkey = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
